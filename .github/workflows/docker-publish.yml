# actions workflow to build and push an image to dockerhub
# not sure the exact formatting of this, so I'm just gonna space stuff out and try to make it readable
name: Build / Push to DockerHub

# Instead of only triggering on main, only trigger when a semantic version tag is pushed
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-push-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      # Generate image tags
      - name: Docker MetaData
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: nfairweather93/count-up
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}

      # Should use the repo secrets that I put in before
      - name: DockerHub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Build / Push
        uses: docker/build-push-action@v7
        with:
          context: ./web-content/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}